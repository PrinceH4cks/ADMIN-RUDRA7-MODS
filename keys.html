    <script type="module">
        import { auth, db } from "./js/firebase-config.js";
        import { onAuthStateChanged, signOut } from "firebase/auth";
        import { ref, get, set, update, remove } from "firebase/database";

        window.auth = auth;
        window.db = db;
        window.signOut = signOut;
        window.ref = ref;
        window.get = get;
        window.set = set;
        window.update = update;
        window.remove = remove;

function applyAdminChip() {
            const el = document.querySelector("#adminEmail .uc-name");
            const isMobile = window.matchMedia("(max-width: 900px)").matches || window.matchMedia("(pointer: coarse)").matches;
            if (el) el.innerText = isMobile ? "Admin" : (window.adminEmailAddr || "");
        }
        window.applyAdminChip = applyAdminChip;
        window.addEventListener("resize", applyAdminChip);

        onAuthStateChanged(auth, function(user) {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            const loginTime = parseInt(localStorage.getItem("adminLoginTime") || "0", 10);
            if (!loginTime) {
                localStorage.setItem("adminLoginTime", String(Date.now()));
            } else if (Date.now() - loginTime > 24 * 60 * 60 * 1000) {
                signOut(auth).then(function() {
                    sessionStorage.removeItem("adminLoggedIn");
                    localStorage.removeItem("adminLoginTime");
                    window.location.href = "index.html";
                });
                return;
            }
            window.adminEmailAddr = user.email;
            applyAdminChip();
            loadKeys();
        });

        document.getElementById("logoutBtn").addEventListener("click", function() {
            signOut(auth).then(function() {
                sessionStorage.removeItem("adminLoggedIn");
                window.location.href = "index.html";
            });
        });

        document.querySelectorAll(".nav-item, .m-item").forEach(function(item) {
            item.addEventListener("click", function() {
                var view = item.dataset.view;
                if (view === "logout") {
                    document.getElementById("logoutBtn").click();
                    return;
                }
                if (view === "keys") return;
if (view === "floating") {
                    window.location.href = "floating.html";
                    return;
                }
                if (view === "notifications") {
                    window.location.href = "notifications.html";
                    return;
                }
                if (view === "settings") {
                    if (item.classList.contains("m-item")) {
                        window.location.href = "settings.html";
                        return;
                    }
                    item.classList.toggle("open");
                    return;
                }
                window.location.href = "dashboard.html?view=" + view;
            });
        });

        function showToast(msg, isError) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.className = "toast" + (isError ? " error" : "");
            toast.style.display = "flex";
            toast.style.animation = "none";
            void toast.offsetWidth;
            toast.style.animation = "";
            setTimeout(function() { toast.style.display = "none"; }, 2600);
        }
        window.showToast = showToast;

        function esc(s) {
            return String(s || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/'/g, "&#39;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
        window.esc = esc;

        function jsStr(s) {
            return String(s || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
        }
        window.jsStr = jsStr;

        window.deviceCache = {};
        window.deviceModalKey = "";

        function deviceChip(did) {
            return '<span class="key-expiry" style="display:inline-flex; align-items:center; gap:4px; margin-right:8px;" title="' + esc(did) + '"><svg class="svg-ic" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg> ' + esc(did.length > 12 ? did.slice(0, 12) + "..." : did) + '</span>';
        }
        window.deviceChip = deviceChip;

        function showDevices(key) {
            const ids = window.deviceCache[key] || [];
            if (!ids.length) { showToast("No devices bound yet!"); return; }
            window.deviceModalKey = key;
            const rows = ids.map(function(did) {
                return '<div style="display:flex; align-items:center; justify-content:space-between; gap:10px; background:rgba(255,255,255,0.04); border-radius:10px; padding:8px 12px; margin-bottom:6px;">' +
                    '<span style="font-size:11px; color:#94a3b8; font-family:monospace; word-break:break-all;">' + esc(did) + '</span>' +
                    '<button class="btn btn-red btn-small" style="flex-shrink:0;" onclick="unbindDevice(\'' + jsStr(key) + '\',\'' + jsStr(did) + '\')">RESET</button>' +
                    '</div>';
            }).join("");
            document.getElementById("modalBody").innerHTML =
                '<h3 style="display:flex; justify-content:space-between; align-items:center;">Devices (' + ids.length + ')<button class="btn btn-red btn-small" onclick="closeModal()">CLOSE</button></h3>' +
                '<div style="max-height:60vh; overflow-y:auto;">' + rows + '</div>';
            document.getElementById("modalOverlay").classList.add("show");
        }
        window.showDevices = showDevices;

        function loadKeys() {
            const list = document.getElementById("keysList");
            list.innerHTML = '<div class="empty-state">Loading...</div>';
            get(ref(db, "ActiveUserKeys")).then(function(snap) {
                window.markSkeletonSettled && window.markSkeletonSettled();
                list.innerHTML = "";
                if (!snap.exists()) {
                    list.innerHTML = '<div class="empty-state">No keys yet. Add one above.</div>';
                    return;
                }
                const keys = snap.val();
                window.lockMap = {};
                let anyLocked = false;
                Object.keys(keys).forEach(function(k) {
                    const locked = !!(keys[k] || {}).locked;
                    window.lockMap[k] = locked;
                    if (locked) anyLocked = true;
                });
window.anyKeyLocked = anyLocked;
                const entries = [];
                Object.keys(keys).forEach(function(key) {

            window.keyFilterState = cat;
            window.keysPageSize = 15;
            const btns = document.querySelectorAll(".key-filter");
            btns.forEach(function(b) {
                b.classList.toggle("active", b.getAttribute("data-cat") === cat);
            });
            loadKeys();
        }
        window.filterKeys = filterKeys;

        let pendingLockAction = null;

        function requireLockPassword(callback) {
            pendingLockAction = callback;
            document.getElementById("modalBody").innerHTML =
                '<h3 style="display:flex; justify-content:space-between; align-items:center;">Developer Security<button class="btn btn-red btn-small" onclick="closeModal()">CLOSE</button></h3>' +
                '<div style="font-size:12px; color:var(--muted); margin-bottom:12px; line-height:1.5;">This key is protected by the developer. Enter the password to continue:</div>' +
'<input type="password" id="lockPassInput" placeholder="Enter password" readonly onpointerdown="this.removeAttribute(\'readonly\')" onfocus="this.removeAttribute(\'readonly\')" autocomplete="off" name="lockpassnl" autocapitalize="none" autocorrect="off" spellcheck="false" data-lpignore="true" style="margin-bottom:14px;">' +
                '<div style="display:flex; gap:10px; justify-content:flex-end;">' +
                '<button class="btn btn-red btn-small" onclick="closeModal()">CANCEL</button>' +
                '<button class="btn btn-small" onclick="confirmLockPassword()">CONFIRM</button></div>';
            document.getElementById("modalOverlay").classList.add("show");
            const inp = document.getElementById("lockPassInput");
            setTimeout(function() { if (inp && !inp.hasAttribute("readonly")) inp.focus(); }, 100);
            document.getElementById("lockPassInput").addEventListener("keydown", function(e) { if (e.key === "Enter") confirmLockPassword(); });
        }
        window.requireLockPassword = requireLockPassword;

        function confirmLockPassword() {
            const val = (document.getElementById("lockPassInput").value || "").trim();
            if (val !== "0007") {
                showToast("Wrong password!", true);
                const inp = document.getElementById("lockPassInput");
                if (inp) { inp.value = ""; inp.focus(); }
                return;
            }
            const fn = pendingLockAction;
            pendingLockAction = null;
            closeModal();
            if (typeof fn === "function") {
                fn();
            }
        }
        window.confirmLockPassword = confirmLockPassword;

        function toggleKeyLock(key) {
            requireLockPassword(function() {
                get(ref(db, "ActiveUserKeys/" + key)).then(function(snap) {
                    const data = snap.val() || {};
                    const nextLocked = !data.locked;
                    if (nextLocked) {
                        get(ref(db, "ActiveUserKeys")).then(function(snapAll) {
                            let conflict = false;
                            if (snapAll.exists()) {
                                const all = snapAll.val();
                                Object.keys(all).forEach(function(k) {
                                    if (k !== key && all[k] && all[k].locked) conflict = true;
                                });
                            }
                            if (conflict) {
                                showToast("Unlock the key first!", true);
                                return;
                            }
                            update(ref(db, "ActiveUserKeys/" + key), { locked: true }).then(function() {
                                showToast("Key LOCKED! Delete/Edit/Ban are now password protected.");
                                loadKeys();
                            }).catch(function() { showToast("Error!", true); });
                        });
                        return;
                    }
                    update(ref(db, "ActiveUserKeys/" + key), { locked: false }).then(function() {
                        showToast("Key unlocked!");
                        loadKeys();
                    }).catch(function() { showToast("Error!", true); });
                });
            });
        }
        window.toggleKeyLock = toggleKeyLock;

        function toggleBan(key, isPasswordOk) {
            get(ref(db, "ActiveUserKeys/" + key)).then(function(snap) {
                const data = snap.val() || {};
                if (data.locked && !isPasswordOk) {
                    requireLockPassword(function() { toggleBan(key, true); });
                    return;
                }
                const banned = !data.banned;
                update(ref(db, "ActiveUserKeys/" + key), { banned: banned }).then(function() {
                    showToast(banned ? "Key banned!" : "Key unbanned!");
                    loadKeys();
                }).catch(function() { showToast("Error!", true); });
            });
        }
        window.toggleBan = toggleBan;

        function unbindDevice(key, deviceId, isPasswordOk) {
            if ((window.lockMap && window.lockMap[key]) && !isPasswordOk) {
                requireLockPassword(function() { unbindDevice(key, deviceId, true); });
                return;
            }
            if (!confirm("Unbind device " + deviceId + " from this key? It can log in again only if unused.")) return;
            const updates = {};
            updates["ActiveUserKeys/" + key + "/boundDeviceId"] = "NONE";
            updates["ActiveUserKeys/" + key + "/isUsed"] = false;
            updates["ActiveUserKeys/" + key + "/boundDevices/" + deviceId] = null;
            update(ref(db), updates).then(function() {
                showToast("Device unbound!");
                loadKeys();
                if (window.deviceModalKey && document.getElementById("modalOverlay").classList.contains("show")) {
                    showDevices(window.deviceModalKey);
                }
            }).catch(function() { showToast("Error!", true); });
        }
        window.unbindDevice = unbindDevice;

        function editKey(key, isPasswordOk) {
            get(ref(db, "ActiveUserKeys/" + key)).then(function(snap) {
                const data = snap.val() || {};
                if (data.locked && !isPasswordOk) {
                    requireLockPassword(function() { editKey(key, true); });
                    return;
                }
                const type = data.type || "Normal";
                editTypeState = type;
                editLimitState = parseInt(data.maxDevices, 10) || 0;
                const dur = data.durationHours || 24;
                const boundId = data.boundDeviceId && String(data.boundDeviceId) !== "NONE" && String(data.boundDeviceId) !== "none" ? String(data.boundDeviceId) : "";
                const boundMap = data.boundDevices || {};
                const allDeviceIds = [];
                if (boundId) allDeviceIds.push(boundId);
                Object.keys(boundMap).forEach(function(did) { if (did !== boundId) allDeviceIds.push(did); });
                window.deviceCache[key] = allDeviceIds;
                document.getElementById("modalBody").innerHTML =
                    '<h3>Edit Key: ' + esc(key) + '</h3>' +
                    '<div class="form-row"><div><label>User Name / Note</label><input type="text" id="mKeyNote" value="' + esc(data.note || data.name || "") + '"></div></div>' +
                    '<div class="form-row"><div><label>Type</label><div class="custom-select">' +
                    '<button type="button" class="cs-trigger" onclick="toggleEditTypeDropdown()">' +
                    '<span class="cs-value" id="mTypeValue">' + esc(type) + '</span>' +
                    '<span class="cs-arrow">▾</span></button>' +
                    '<div class="cs-menu" id="mTypeMenu"></div></div></div></div>' +
                    '<div class="form-row"><div><label>Duration (hours)</label><input type="number" id="mKeyDuration" value="' + dur + '" min="1"><div class="field-hint">Use <b>99999</b> for lifetime.</div></div></div>' +
                    '<div class="form-row"><div><label>Device Limit</label><div class="custom-select">' +
                    '<button type="button" class="cs-trigger" onclick="toggleEditLimitDropdown()">' +
                    '<span class="cs-value" id="mLimitValue">' + esc(limitLabel(data.maxDevices)) + '</span>' +
                    '<span class="cs-arrow">▾</span></button>' +
                    '<div class="cs-menu" id="mLimitMenu"></div></div></div></div>' +
                    (allDeviceIds.length ? '<div style="margin-bottom:14px;"><label>Bound Devices (' + allDeviceIds.length + ')</label>' +
                        '<div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;">' + allDeviceIds.slice(0, 5).map(deviceChip).join("") +
                        (allDeviceIds.length > 5 ? '<span class="key-expiry">+' + (allDeviceIds.length - 5) + ' more</span>' : '') +
                        '</div>' +
                        '<button class="btn btn-small" onclick="showDevices(\'' + jsStr(key) + '\')">VIEW ALL DEVICES</button></div>' : '') +
                    '<div style="display: flex; gap: 10px; justify-content: flex-end;">' +
                    '<button class="btn btn-red btn-small" onclick="closeModal()">CANCEL</button>' +
                    '<button class="btn btn-small" onclick="saveKeyEdit(\'' + jsStr(key) + '\')">SAVE</button></div>';
                document.getElementById("modalOverlay").classList.add("show");
            });
        }
        window.editKey = editKey;

        function saveKeyEdit(key) {
            const note = document.getElementById("mKeyNote").value.trim();
            const type = editTypeState;
            const durationHours = parseInt(document.getElementById("mKeyDuration").value, 10);
            if (!durationHours || durationHours <= 0) { showToast("Duration must be > 0 hours!", true); return; }
            update(ref(db, "ActiveUserKeys/" + key), { note: note, type: type, durationHours: durationHours, maxDevices: editLimitState }).then(function() {
                showToast("Key updated!");
                closeModal();
                loadKeys();
            }).catch(function() { showToast("Error!", true); });
        }
        window.saveKeyEdit = saveKeyEdit;

        function deleteKey(key, isPasswordOk) {
            get(ref(db, "ActiveUserKeys/" + key)).then(function(snap) {
                const d = snap.val() || {};
                if (d.locked && !isPasswordOk) {
                    requireLockPassword(function() { deleteKey(key, true); });
                    return;
                }
                if (!confirm("Delete key " + key + "?")) return;
                remove(ref(db, "ActiveUserKeys/" + key)).then(function() {
                    showToast("Key deleted!");
                    loadKeys();
                }).catch(function() { showToast("Error!", true); });
            });
        }
        window.deleteKey = deleteKey;

        function clearExpiredKeys() {
            get(ref(db, "ActiveUserKeys")).then(function(snap) {
                if (!snap.exists()) { showToast("No keys to clean!"); return; }
                const keys = snap.val();
                const now = Date.now();
                const expired = [];
                Object.keys(keys).forEach(function(key) {
                    const data = keys[key] || {};
                    const dur = data.durationHours;
                    let isExpired = false;
                    if (dur) {
                        if (dur !== 99999 && data.createdAt > 0) isExpired = now > (data.createdAt + dur * 3600000);
                    } else {
                        isExpired = data.expiresAt > 0 && now > data.expiresAt;
                    }
                    if (isExpired) expired.push(key);
                });
                if (!expired.length) { showToast("No expired keys!"); return; }
                if (!confirm("Delete " + expired.length + " expired key(s)?")) return;
                const updates = {};
                expired.forEach(function(key) { updates["ActiveUserKeys/" + key] = null; });
                update(ref(db), updates).then(function() {
                    showToast(expired.length + " expired key(s) deleted!");
                    loadKeys();
                }).catch(function() { showToast("Error!", true); });
            }).catch(function() { showToast("Error loading keys!", true); });
        }
        window.clearExpiredKeys = clearExpiredKeys;

        function closeModal() {
            pendingLockAction = null;
            window.deviceModalKey = "";
            document.getElementById("modalOverlay").classList.remove("show");
        }
        window.closeModal = closeModal;

        document.getElementById("modalOverlay").addEventListener("click", function(e) {
            if (e.target === this) closeModal();
        });
    </script>
    <script src="js/script.js" defer></script>
</body>
</html>
